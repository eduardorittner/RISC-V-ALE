<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code testing tool</title>
</head>
<body style="margin:0">
  <header style="padding: 8px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
    <button onclick="clear_localstorage();">Clear localStorage</button>
    <label for="file_input" style="font-size: 14px;">Select File:</label>
    <input type="file" name="" id="file_input">
    <label for="activity_url" style="font-size: 14px;">URL:</label>
    <input type="text" name="" id="activity_url">
    <button onclick="run_tests();">Run Tests</button>
    <button onclick="get_results();">Get Results</button>
    <label for="test_timeout" style="font-size: 14px;">Test Timeout:</label>
    <input type="text" name="" id="test_timeout" value="60000">
    <label for="load_time" style="font-size: 14px;">Load time:</label>
    <input type="text" name="" id="load_time" value="1000">
  </header>
  <main style="height: calc(100vh - 50px);">
    <iframe id="sim_iframe" style="margin:0;width:100%;height:100%;border:none;" src="./index.html" sandbox="allow-modals allow-scripts allow-same-origin"></iframe>
  </main>
  <script src="assets/js/z-worker.js"></script>
  <script src="assets/js/zip.min.js"></script>
  <script>
    var files = [];
    async function unzip(file){
      const reader = new zip.ZipReader(new zip.BlobReader(file));
      const entries = await reader.getEntries();
      for (let i = 0; i < entries.length; i++) {
        const element = entries[i];
        const name = element.filename.replaceAll(" ", "_").replaceAll("/", "_");
        if(element.directory) continue;
        const blob = await element.getData(new zip.BlobWriter(['application/binary']));
        files.push(new File([blob], name));
        console.log(name);
        if(!localStorage.getItem(name)){
          localStorage.setItem(name,"");
        }
      }
      // close the ZipReader
      await reader.close();
    }
    
    file_input.onchange = function () {
      unzip(file_input.files[0]);
    }

    function clear_localstorage() {
      localStorage.clear();
    }

    var sleep = (milliseconds) => {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    };

    async function run_test(file){
      sim_iframe.src = activity_url.value;
      setTimeout(function () {
        sim_iframe.contentWindow.postMessage({cmd: {op: "load_files_from_array", params: [file]}});
        sim_iframe.contentWindow.postMessage({cmd: {op: "start_assistant", params: {}}});
      }, document.getElementById("load_time").value*3);
      return new Promise(resolve => {
        let tm = setTimeout(_ => { 
          test_log["comment"] = "Test timeout";
          test_log["grade"] = 0;
          resolve();
        }, document.getElementById("test_timeout").value);
        finish_test_cb = _ => {
          clearTimeout(tm);
          resolve();
        }
      });
    }

    var finish_test_cb = _ => {};
    var test_log = {log: []};
    async function run_tests(){
      for (let i = 0; i < files.length; i++) {
        const element = files[i];
        test_log = {log: []}
        if(localStorage.getItem(element.name) === ""){
          test_log["filename"] = element.name;
          await run_test(element);
          await sleep(document.getElementById("load_time").value*2);
          sim_iframe.contentWindow.location.reload();
          localStorage.setItem(element.name, JSON.stringify(test_log));
          await sleep(document.getElementById("load_time").value*3);
        }
      }
    }

    function download(filename, text) {
      var element = document.createElement('a');
      var url = URL.createObjectURL( new Blob( [text], {type:'text/plain'} ) );
      element.setAttribute('href', url);
      element.setAttribute('download', filename);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
      URL.revokeObjectURL(url);
    }

    function get_results() {
      let all_results = []
      for (var i = 0; i < localStorage.length; i++){
        const str = localStorage.getItem(localStorage.key(i));
        if(str != "" && str != undefined) all_results.push(JSON.parse(str));
      }
      download("test_results.json", JSON.stringify(all_results));
    }

    function test() {
      sim_iframe.contentWindow.postMessage({cmd: {op: "load_file"}});
    }
    function test2() {
      sim_iframe.contentWindow.postMessage({cmd: {op: "echo", params: "oi"}});
    }
    onmessage = function name(data) {
      if(data.data.finish_test) {
        test_log["comment"] = data.data.comment;
        test_log["grade"] = data.data.grade;
        finish_test_cb();
      }else{
        test_log.log.push(data.data);
      }
    }
  </script>
</body>
</html>
